---
# K8s 集群全域配置

# K8s 版本升級路徑配置
k8s_upgrade_paths:
  # 版本定義 - 需要時去掉 # 啟用
  versions:
    # "1.28.5":
    #   description: "舊版本"
    #   support_until: "2024-12-28"
    #   repo_version: "1.28"
    # "1.29.10":
    #   description: "舊穩定版"
    #   support_until: "2025-02-28"
    #   repo_version: "1.29"
    # "1.30.8":
    #   description: "上一版"
    #   support_until: "2025-06-28"
    #   repo_version: "1.30"
    "1.31.10":
      description: "當前版本"
      support_until: "2025-10-28"
      repo_version: "1.31"
    "1.32.6":
      description: "穩定版本"
      support_until: "2026-02-28"
      repo_version: "1.32"
    "1.33.2":
      description: "最新版本"
      support_until: "2026-06-28"
      repo_version: "1.33"
    # "1.34.0":  # 未來版本 - 發布後啟用
    #   description: "未來版本"
    #   support_until: "2026-10-28"
    #   repo_version: "1.34"
    
  # 升級路徑規則
  upgrade_matrix:
    # 從 1.31.10 可以升級到的版本
    "1.31.10":
      direct: ["1.32.6"]           # 可以直接升級
      staged: ["1.32.6", "1.33.2"] # 分段升級路徑
      
    # 從 1.32.6 可以升級到的版本  
    "1.32.6":
      direct: ["1.33.2"]           # 可以直接升級
      staged: ["1.33.2"]           # 直接升級即可
      
    # 從 1.33.2 可以升級到的版本
    "1.33.2":
      direct: []                   # 已是最新，暫無升級目標
      staged: []
      # direct: ["1.34.0"]         # 未來啟用
      # staged: ["1.34.0"]
      
    # 未來版本升級路徑 - 需要時啟用
    # "1.34.0":
    #   direct: ["1.35.0"]
    #   staged: ["1.35.0"]

# 向後相容 - 舊配置格式
k8s_versions:
  current: "1.31.10"
  supported: "{{ k8s_upgrade_paths.versions }}"

# 預設目標版本
default_target_version: "1.32.6"

# 安全設定
safety_settings:
  enable_node_drain: true
  drain_timeout: 300
  health_check_retries: 30
  health_check_delay: 10
  backup_configs: true

# 套件管理
packages:
  hold_packages: true
  force_update: true

# 升級策略
upgrade_strategy:
  staged_upgrade: true
  parallel_workers: true
  health_check_between_nodes: true
  pause_between_environments: true

# 網路設定
network:
  uat_vip: "10.240.0.10"
  prod_vip: "10.240.0.20"

# 備份設定
backup:
  enabled: true
  path: "/tmp/k8s-backup-{{ ansible_date_time.epoch }}"
  retain_days: 7