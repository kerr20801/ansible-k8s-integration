# ================================
# Worker 節點專用變數
# ================================

# Worker 節點角色
node_role: worker
node_type: worker

# kubelet 設定
kubelet_config:
  max_pods: 110
  cluster_dns: "{{ service_network_cidr | ipaddr('10') | ipaddr('address') }}"
  cluster_domain: cluster.local
  container_runtime_endpoint: unix:///run/containerd/containerd.sock

# Worker 節點標籤
node_labels:
  - "node-role.kubernetes.io/worker="
  - "environment={{ environment }}"
  - "node-type=worker"

# 儲存設定
storage_config:
  local_storage_enabled: true
  local_storage_path: /opt/local-storage

# 網路設定
cni_config:
  name: flannel
  bridge_name: cni0
  mtu: 1450

# 資源限制
resource_limits:
  cpu_request: 100m
  memory_request: 128Mi
  ephemeral_storage_request: 1Gi

# 系統調優
system_tuning:
  vm_max_map_count: 262144
  fs_file_max: 1048576
  net_core_somaxconn: 32768