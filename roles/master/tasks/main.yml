---
# ================================
# Master 節點設定 Role
# ================================

- name: Master 節點設定開始
  debug:
    msg: "開始設定 Master 節點 - {{ inventory_hostname }}"

# ================================
# 初始化第一個 Master
# ================================

- name: 檢查是否已初始化集群
  stat:
    path: /etc/kubernetes/admin.conf
  register: k8s_admin_conf

- name: 初始化第一個 Master 節點
  command: >
    kubeadm init
    --apiserver-advertise-address={{ ansible_default_ipv4.address }}
    --apiserver-bind-port={{ apiserver_bind_port | default(6443) }}
    --pod-network-cidr={{ pod_network_cidr }}
    --service-cidr={{ service_network_cidr }}
    --control-plane-endpoint={{ cluster_vip }}:{{ apiserver_bind_port | default(6443) }}
    --upload-certs
  become: yes
  register: kubeadm_init_result
  when: 
    - not k8s_admin_conf.stat.exists
    - inventory_hostname == groups['masters'][0]

- name: 顯示初始化結果
  debug:
    var: kubeadm_init_result.stdout_lines
  when: 
    - kubeadm_init_result is defined
    - kubeadm_init_result.stdout_lines is defined

# ================================
# 設定 kubeconfig
# ================================

- name: 建立 .kube 目錄
  file:
    path: "{{ ansible_env.HOME }}/.kube"
    state: directory
    mode: '0755'
  when: inventory_hostname == groups['masters'][0]

- name: 複製 admin.conf 到用戶目錄
  copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ ansible_env.HOME }}/.kube/config"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
    remote_src: yes
  become: yes
  when: inventory_hostname == groups['masters'][0]

# ================================
# 安裝 CNI 網路插件
# ================================

- name: 下載 Flannel 網路插件
  get_url:
    url: https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
    dest: /tmp/kube-flannel.yml
    mode: '0644'
  when: 
    - inventory_hostname == groups['masters'][0]
    - install_components.flannel_cni | default(true)

- name: 安裝 Flannel 網路插件
  kubernetes.core.k8s:
    state: present
    src: /tmp/kube-flannel.yml
    kubeconfig: "{{ ansible_env.HOME }}/.kube/config"
  when: 
    - inventory_hostname == groups['masters'][0]
    - install_components.flannel_cni | default(true)

# ================================
# 獲取加入令牌
# ================================

- name: 生成 Master 加入令牌
  command: kubeadm token create --print-join-command --certificate-key $(kubeadm init phase upload-certs --upload-certs | tail -1)
  become: yes
  register: master_join_command
  when: 
    - inventory_hostname == groups['masters'][0]
    - groups['masters'] | length > 1

- name: 生成 Worker 加入令牌
  command: kubeadm token create --print-join-command
  become: yes
  register: worker_join_command
  when: inventory_hostname == groups['masters'][0]

# ================================
# 加入其他 Master 節點
# ================================

- name: 加入其他 Master 節點
  command: "{{ hostvars[groups['masters'][0]]['master_join_command']['stdout'] }}"
  become: yes
  when: 
    - inventory_hostname != groups['masters'][0]
    - groups['masters'] | length > 1
    - not k8s_admin_conf.stat.exists

# ================================
# 設定其他 Master 的 kubeconfig
# ================================

- name: 建立其他 Master 的 .kube 目錄
  file:
    path: "{{ ansible_env.HOME }}/.kube"
    state: directory
    mode: '0755'
  when: inventory_hostname != groups['masters'][0]

- name: 複製其他 Master 的 admin.conf
  copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ ansible_env.HOME }}/.kube/config"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
    remote_src: yes
  become: yes
  when: inventory_hostname != groups['masters'][0]

# ================================
# 移除 Master 節點的污點 (如果需要)
# ================================

- name: 移除 Master 節點污點 (允許調度 Pod)
  kubernetes.core.k8s_taint:
    name: "{{ inventory_hostname }}"
    taints: []
    kubeconfig: "{{ ansible_env.HOME }}/.kube/config"
  when: 
    - inventory_hostname == groups['masters'][0]
    - groups['workers'] | length == 0  # 如果沒有 Worker 節點

- name: Master 節點設定完成
  debug:
    msg: "Master 節點設定完成 - {{ inventory_hostname }}"