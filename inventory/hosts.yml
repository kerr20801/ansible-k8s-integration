# ================================
# 統一 Kubernetes Cluster Inventory
# 不分環境，用標籤和變數區分
# ================================

all:
  children:
    masters:
      hosts:
        # Production Masters
        prod-master1:
          ansible_host: 10.240.0.81
          environment: production
          cluster_name: prod-k8s
        prod-master2:
          ansible_host: 10.240.0.82
          environment: production
          cluster_name: prod-k8s
        prod-master3:
          ansible_host: 10.240.0.83
          environment: production
          cluster_name: prod-k8s
        
        # UAT Master
        uat-master:
          ansible_host: 10.240.0.71
          environment: uat
          cluster_name: uat-k8s
    
    workers:
      hosts:
        # Production Workers
        prod-worker1:
          ansible_host: 10.240.0.84
          environment: production
          cluster_name: prod-k8s
        prod-worker2:
          ansible_host: 10.240.0.85
          environment: production
          cluster_name: prod-k8s
        prod-worker3:
          ansible_host: 10.240.0.86
          environment: production
          cluster_name: prod-k8s
        
        # UAT Workers
        uat-worker1:
          ansible_host: 10.240.0.72
          environment: uat
          cluster_name: uat-k8s
        uat-worker2:
          ansible_host: 10.240.0.73
          environment: uat
          cluster_name: uat-k8s

  vars:
    # 共同連線設定
    ansible_user: deployer
    ansible_become: yes
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    ansible_python_interpreter: /usr/bin/python3