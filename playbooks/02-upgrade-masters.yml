---
# ================================
# Master 節點升級劇本
# 逐一升級所有 Master 節點
# ================================

- name: "Upgrade Kubernetes Master Nodes"
  hosts: masters
  become: yes
  serial: 1  # 一次升級一個 Master
  
  vars:
    target_version: "{{ target_version | default(default_target_version) }}"
    major_minor: "{{ target_version.split('.')[:2] | join('.') }}"
    environment: "{{ environment | default('production') }}"
    
  tasks:
    - name: Get current version
      shell: kubelet --version | awk '{print $2}' | sed 's/v//' 2>/dev/null || echo "unknown"
      register: current_version
      
    - name: Skip if already upgraded
      meta: end_host
      when: current_version.stdout == target_version
      
    - name: Display upgrade info
      debug:
        msg: |
          開始升級 Master: {{ inventory_hostname }}
          從版本: {{ current_version.stdout }}
          到版本: {{ target_version }}
          
    # 判斷是否需要分段升級
    - name: Determine if staged upgrade needed
      set_fact:
        need_staged_upgrade: "{{ current_version.stdout.split('.')[1] | int < target_version.split('.')[1] | int - 1 }}"
        
    - name: Show upgrade strategy
      debug:
        msg: |
          升級策略: {{ '分段升級 (跨版本)' if need_staged_upgrade else '直接升級' }}
          
    # 分段升級警告
    - name: Staged upgrade warning
      debug:
        msg: |
          跨版本升級建議:
          當前版本: {{ current_version.stdout }}
          目標版本: {{ target_version }}
          
          對於跨 minor 版本升級，建議分步執行:
          1. 先升級到中間版本 (如 1.30.x)
          2. 再升級到目標版本 {{ target_version }}
      when: need_staged_upgrade
      
    # 主要升級階段
    - name: Main Upgrade Block
      block:
        - name: Update K8S repository  
          shell: |
            curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ major_minor }}/deb/Release.key | sudo tee /etc/apt/keyrings/kubernetes-apt-keyring.asc > /dev/null
            echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v{{ major_minor }}/deb/ /' | sudo tee /etc/apt/sources.list.d/kubernetes.list
            
        - name: Update package cache
          apt:
            update_cache: yes
            
        - name: Unhold K8S packages
          shell: apt-mark unhold kubeadm kubelet kubectl
          
        - name: Upgrade kubeadm first
          apt:
            name: "kubeadm={{ target_version }}-1.1"
            state: present
            force: yes
            
        - name: Verify kubeadm version
          shell: kubeadm version -o short
          register: kubeadm_check
          failed_when: target_version not in kubeadm_check.stdout
          
        - name: Drain master node (first master only)
          shell: kubectl drain {{ ansible_hostname }} --ignore-daemonsets --delete-emptydir-data --force --timeout={{ safety_settings.drain_timeout }}s
          when: 
            - inventory_hostname == groups['masters'][0]
            - safety_settings.enable_node_drain
          delegate_to: "{{ groups['masters'][0] }}"
          ignore_errors: yes
          
        - name: Apply cluster upgrade (first master only)
          shell: kubeadm upgrade apply v{{ target_version }} -y
          when: inventory_hostname == groups['masters'][0]
          timeout: 900  # 15 minutes
          register: cluster_upgrade_result
          
        - name: Apply node upgrade (other masters)
          shell: kubeadm upgrade node
          when: inventory_hostname != groups['masters'][0]
          timeout: 300  # 5 minutes
          register: node_upgrade_result
          
        - name: Upgrade kubelet and kubectl
          apt:
            name: 
              - "kubelet={{ target_version }}-1.1"
              - "kubectl={{ target_version }}-1.1"
            state: present
            force: yes
            
        - name: Restart kubelet
          systemd:
            name: kubelet
            state: restarted
            daemon_reload: yes
            
        - name: Hold K8S packages
          shell: apt-mark hold kubeadm kubelet kubectl
          when: packages.hold_packages
          
        - name: Uncordon master node
          shell: kubectl uncordon {{ ansible_hostname }}
          delegate_to: "{{ groups['masters'][0] }}"
          ignore_errors: yes
          
        - name: Wait for node to be ready
          shell: kubectl get node {{ ansible_hostname }} --no-headers | awk '{print $2}'
          delegate_to: "{{ groups['masters'][0] }}"
          register: node_ready_check
          until: node_ready_check.stdout == "Ready"
          retries: "{{ upgrade_strategy.health_check_retries }}"
          delay: "{{ upgrade_strategy.health_check_delay }}"
          
        - name: Verify upgraded version
          shell: kubectl get node {{ ansible_hostname }} -o jsonpath='{.status.nodeInfo.kubeletVersion}'
          delegate_to: "{{ groups['masters'][0] }}"
          register: verified_version
          
        - name: Show master upgrade success
          debug:
            msg: |
              Master {{ inventory_hostname }} 升級成功!
              新版本: {{ verified_version.stdout }}
              
      rescue:
        - name: Master upgrade failed
          debug:
            msg: "Master {{ inventory_hostname }} 升級失敗"
            
        - name: Uncordon node on failure
          shell: kubectl uncordon {{ ansible_hostname }}
          delegate_to: "{{ groups['masters'][0] }}"
          ignore_errors: yes
          
        - name: Collect failure logs
          shell: journalctl -u kubelet --no-pager -l -n 50
          register: kubelet_logs
          ignore_errors: yes
          
        - name: Display failure logs
          debug:
            msg: |
              Kubelet 日誌 (最後 50 行):
              {{ kubelet_logs.stdout }}
          when: kubelet_logs is defined
          
        - fail:
            msg: "Master 節點升級失敗，請檢查日誌"
            
    # 每個 Master 完成後的暫停
    - name: Pause between masters
      pause:
        prompt: |
          
          {{ inventory_hostname }} 升級完成
          
          請檢查以下狀態:
          1. kubectl get nodes
          2. kubectl get pods --all-namespaces
          3. kubectl cluster-info
          
          確認無誤後按 Enter 繼續下一個 Master，或 Ctrl+C 停止
      when: inventory_hostname != groups['masters'][-1]

# ================================
# 所有 Masters 升級完成後的驗證
# ================================

- name: "Post-Masters Upgrade Verification"
  hosts: masters[0]
  become: yes
  
  tasks:
    - name: Final masters check
      shell: kubectl get nodes -l node-role.kubernetes.io/control-plane --no-headers
      register: masters_status
      
    - name: Check masters versions
      shell: kubectl get nodes -l node-role.kubernetes.io/control-plane -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.nodeInfo.kubeletVersion}{"\n"}{end}'
      register: masters_versions
      
    - name: Verify all masters ready
      shell: kubectl get nodes -l node-role.kubernetes.io/control-plane --no-headers | grep -v Ready | wc -l
      register: unready_masters
      
    - name: Check cluster health
      shell: kubectl get componentstatuses --no-headers 2>/dev/null | grep -v Healthy | wc -l || echo "0"
      register: cluster_health
      ignore_errors: yes
      
    - name: Display masters upgrade summary
      debug:
        msg: |
          所有 Master 節點升級完成！
          
          Masters 狀態:
          {{ masters_status.stdout }}
          
          Masters 版本:
          {{ masters_versions.stdout }}
          
          健康檢查:
          - 未就緒 Masters: {{ unready_masters.stdout }}
          - 集群健康問題: {{ cluster_health.stdout }}
          
          {{ '所有 Masters 健康，可以繼續升級 Workers' if unready_masters.stdout == '0' else '有 Masters 未就緒，請檢查後再繼續' }}
          
          下一步執行:
          ansible-playbook -i inventory/hosts.yml playbooks/03-upgrade-workers.yml -e target_version={{ target_version }}
          
    - name: Fail if masters not healthy
      fail:
        msg: "有 Master 節點未就緒，請修復後再繼續"
      when: unready_masters.stdout != '0'